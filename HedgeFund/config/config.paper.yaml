# Paper Trading Configuration
# Overrides for paper trading environment

environment: paper

broker:
  alpaca_paper_mode: true
  alpaca_base_url: https://paper-api.alpaca.markets
  ib_port: 4001  # Paper trading port

database:
  postgres_database: trading_paper

monitoring:
  log_level: DEBUG  # More verbose in paper trading
  enable_sentry: false

