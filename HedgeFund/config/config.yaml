# Trading System Configuration
# Environment: Development (default)

environment: development
initial_capital: 100000.0

strategy:
  assets:
    - SPY
    - QQQ
    - DIA
    - IWM
  
  allocations:
    SPY: 0.40
    QQQ: 0.30
    DIA: 0.20
    IWM: 0.10
  
  # Put selling
  put_delta_target: -0.30
  put_dte: 14
  position_size_pct: 0.10  # 10% per trade (was 0.01 = 1%, too small!)
  profit_target_pct: 0.50
  
  # Covered calls
  call_delta_target: 0.30
  call_dte: 30
  
  # Hedging
  enable_adaptive_hedge: true
  weeknight_hedge_dte: 2
  weekend_hedge_dte: 14
  hedge_delta_target: -0.50
  hedge_coverage_pct: 1.0
  max_hedge_cost_pct: 0.005
  
  # Capital management
  max_capital_deployed: 0.75
  min_cash_reserve: 0.25

risk:
  # Position limits
  max_contracts_per_trade: 10
  max_contracts_per_strike: 10
  max_delta_per_asset: 5000.0
  max_total_delta: 15000.0
  
  # Circuit breakers
  circuit_breaker_reduce_threshold: -0.08
  circuit_breaker_halt_threshold: -0.12
  position_size_reduction: 0.50
  
  # Margin
  max_margin_utilization: 0.50
  margin_buffer_pct: 0.20
  
  # VaR
  var_confidence: 0.95
  var_lookback_days: 252

broker:
  primary_broker: alpaca
  backup_broker: interactive_brokers
  
  # Alpaca (set via environment variables)
  alpaca_paper_mode: true
  alpaca_base_url: https://paper-api.alpaca.markets
  
  # IB
  ib_host: 127.0.0.1
  ib_port: 4001  # Paper trading port
  ib_client_id: 1
  
  # Execution
  default_order_type: limit
  order_timeout_seconds: 30
  max_retry_attempts: 3
  retry_delay_seconds: 1.0
  
  # Commissions
  option_commission: 0.65
  stock_commission: 0.01

database:
  postgres_host: localhost
  postgres_port: 5432
  postgres_database: trading_dev
  postgres_user: trading
  
  redis_host: localhost
  redis_port: 6379
  redis_db: 0
  
  pool_size: 10
  pool_timeout: 30

monitoring:
  log_level: INFO
  log_file: logs/trading.log
  log_rotation: midnight
  log_retention_days: 2555
  
  metrics_port: 9090
  metrics_enabled: true
  
  enable_pagerduty: false
  enable_email_alerts: true
  enable_sentry: false

