; Supervisor configuration for Hedge Fund Daemon
; Alternative to systemd - useful for development
;
; Installation:
;   pip install supervisor
;   supervisord -c supervisor.conf
;   supervisorctl -c supervisor.conf status

[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=logs/supervisord.pid
nodaemon=false

[unix_http_server]
file=logs/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix://logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:hedgefund-daemon]
command=/mnt/4tb/stock_scanner/market_news/venv/bin/python src/daemon/paper_trading_daemon.py
directory=/mnt/4tb/stock_scanner/market_news/HedgeFund
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=logs/daemon_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=logs/daemon_stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
environment=PYTHONUNBUFFERED=1,ENV=paper
user=kody


