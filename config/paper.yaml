mode: paper

# Trading parameters
target_assets:
  - SPY
  - QQQ
  - TQQQ

base_weights:
  SPY: 0.33
  QQQ: 0.33
  TQQQ: 0.34

# Transaction costs (simulated)
commission_rate: 0.001  # 0.1%
slippage_rate: 0.0005   # 0.05%

# Initial capital
initial_capital: 100000

# Hedging
enable_hedging: false
hedge_delta: -0.5
hedge_coverage: 1.0

# Risk limits
max_position_size: 0.5
max_portfolio_var: 0.02
max_leverage: 1.0

# Data cache
cache_duration: 60  # seconds

# Supabase (loaded from env or Secret Manager)
supabase:
  url: ""  # Set via SUPABASE_URL env var
  key: ""  # Set via SUPABASE_KEY env var
